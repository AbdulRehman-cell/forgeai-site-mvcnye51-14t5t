services:
  - type: web
    name: forgeai-site-mvcnye51
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        fromDatabase:
          name: forgeai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false

databases:
  - name: forgeai-db
    databaseName: forgeai_db
    user: forgeai_user
    plan: free
    region: oregon
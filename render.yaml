services:
  - type: web
    name: forgeai-site-mvcnye51
    env: docker
    plan: starter
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        fromDatabase:
          name: forgeai-mongo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false

databases:
  - name: forgeai-mongo-db
    databaseName: forgeai_db
    plan: starter